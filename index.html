<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisitOSLO · Media omtale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:        #0066CC;
      --primary-hover:  #0052A3;
      --primary-light:  #E6F0FA;
      --primary-dark:   #003D7A;

      --text:           #1A2433;
      --text-muted:     #5C6B7A;
      --text-faint:     #94A0AE;

      --bg:             #F5F7FA;
      --surface:        #FFFFFF;
      --surface-hover:  #F8FAFC;
      --surface-alt:    #F1F4F8;

      --border:         #E1E6ED;
      --border-strong:  #C9D2DC;

      --success:        #16A34A;
      --success-bg:     #DCFCE7;
      --warning:        #D97706;
      --warning-bg:     #FEF3C7;
      --danger:         #DC2626;
      --danger-bg:      #FEE2E2;
      --info:           #0891B2;
      --info-bg:        #CFFAFE;

      --shadow-xs:      0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm:      0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md:      0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-lg:      0 12px 32px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

    /* TOPBAR */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .topbar-brand .mark {
      width: 28px; height: 28px;
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
      letter-spacing: 0;
    }
    .topbar-brand .sub {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 14px;
    }

    .topbar-nav {
      display: flex; align-items: stretch;
      height: 100%;
      margin-left: 8px;
    }
    .topbar-nav a {
      display: flex; align-items: center;
      padding: 0 18px;
      height: 100%;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
      border-bottom: 2px solid transparent;
    }
    .topbar-nav a:hover { color: var(--text); }
    .topbar-nav a.is-active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .topbar-spacer { flex: 1; }

    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .test-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      font-size: 13px; font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .test-toggle:hover { background: var(--surface-hover); color: var(--text); }
    .test-toggle.is-on { color: var(--warning); background: var(--warning-bg); border-color: transparent; }
    .test-toggle .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
    .test-toggle.is-on .dot { background: var(--warning); }

    /* CONTAINER */
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px 48px;
    }

    /* PAGE HEADER */
    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .page-head-left { flex: 1; min-width: 0; }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text);
      margin: 0 0 4px;
      line-height: 1.2;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }
    .page-actions { display: flex; gap: 8px; align-items: center; }

    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .breadcrumb a { cursor: pointer; }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .sep { color: var(--text-faint); font-size: 11px; }
    .breadcrumb .current { color: var(--text); font-weight: 500; }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      line-height: 1.4;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--text-muted); }
    .btn-ghost { background: transparent; color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
    .btn-danger { background: var(--surface); color: var(--danger); border-color: var(--border); }
    .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:disabled:hover { background: var(--primary); }
    .btn-sm { padding: 5px 10px; font-size: 12.5px; }
    .btn .icon { font-size: 15px; line-height: 1; }

    /* CARDS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-xs);
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-search {
      flex: 1; min-width: 220px;
      position: relative;
    }
    .filter-search input {
      width: 100%;
      padding: 7px 12px 7px 32px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .filter-search input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }
    .filter-search::before {
      content: '⌕';
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-faint); font-size: 16px; pointer-events: none;
    }
    .filter-field { display: flex; flex-direction: column; gap: 3px; }
    .filter-field label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .filter-field input, .filter-field select {
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      min-width: 140px;
    }
    .filter-field input:focus, .filter-field select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .table-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .table-head h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .table-head .meta {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    table.data {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    table.data thead th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.data tbody tr {
      cursor: pointer;
      transition: background 0.1s;
    }
    table.data tbody tr:hover { background: var(--surface-hover); }
    table.data tbody tr:last-child td { border-bottom: none; }
    table.data .col-date { width: 110px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.data .col-title { font-weight: 500; color: var(--text); min-width: 280px; }
    table.data .col-source { color: var(--text-muted); white-space: nowrap; }
    table.data .col-cat { white-space: nowrap; }
    table.data .col-author { white-space: nowrap; }
    table.data .col-author a { color: var(--primary); cursor: pointer; }
    table.data .col-author a:hover { text-decoration: underline; }
    table.data .col-members { width: 100px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    table.data .col-actions { width: 60px; text-align: right; }

    /* BADGES */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      font-size: 12px; font-weight: 500;
      border-radius: 4px;
      background: var(--surface-alt);
      color: var(--text-muted);
      line-height: 1.5;
      white-space: nowrap;
    }
    .badge-blue   { background: var(--primary-light); color: var(--primary-dark); }
    .badge-green  { background: var(--success-bg); color: #14532D; }
    .badge-amber  { background: var(--warning-bg); color: #78350F; }
    .badge-cyan   { background: var(--info-bg); color: #155E75; }
    .badge-pink   { background: #FCE7F3; color: #831843; }
    .badge-violet { background: #EDE9FE; color: #4C1D95; }
    .badge-rose   { background: #FFE4E6; color: #881337; }
    .badge-slate  { background: var(--surface-alt); color: #334155; }
    .badge-orange { background: #FFEDD5; color: #7C2D12; }
    .badge-teal   { background: #CCFBF1; color: #134E4A; }

    .count-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      font-size: 12px; font-weight: 500;
      background: var(--surface-alt);
      color: var(--text-muted);
      border-radius: 10px;
    }

    /* EMPTY STATE */
    .empty {
      padding: 80px 32px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .empty-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--surface-alt);
      color: var(--text-muted);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }
    .empty h3 {
      margin: 0 0 6px;
      font-size: 16px; font-weight: 600;
      color: var(--text);
    }
    .empty p {
      margin: 0 auto 20px;
      max-width: 400px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* TEST BANNER */
    .test-banner {
      background: var(--warning-bg);
      border-bottom: 1px solid #FCD34D;
      padding: 8px 32px;
      font-size: 13px;
      color: #78350F;
      text-align: center;
    }
    .test-banner button {
      background: none; border: none; padding: 0; margin-left: 8px;
      color: #78350F; text-decoration: underline; font: inherit; cursor: pointer;
      font-weight: 500;
    }
    .test-banner button:hover { color: #451A03; }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
    }
    @media (max-width: 880px) {
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
    }
    .form-section-meta h4 {
      margin: 0 0 4px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
    }
    .form-section-meta p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .form-section {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .form-section:first-of-type { padding-top: 8px; }
    .form-section:last-of-type { border-bottom: none; }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .field-label .req { color: var(--danger); margin-left: 2px; }
    .field-help { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

    .input, .textarea, .select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
    }
    .input::placeholder, .textarea::placeholder { color: var(--text-faint); }
    .textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .select { cursor: pointer; appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235C6B7A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 540px) { .row-2 { grid-template-columns: 1fr; } }

    /* PICKER */
    .picker { position: relative; }
    .picker-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 280px; overflow-y: auto;
      z-index: 30;
      box-shadow: var(--shadow-md);
    }
    .picker-row {
      padding: 9px 12px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .picker-row:last-child { border-bottom: none; }
    .picker-row:hover { background: var(--surface-hover); }
    .picker-row .name { font-weight: 500; font-size: 13.5px; color: var(--text); }
    .picker-row .meta { font-size: 12.5px; color: var(--text-muted); }
    .picker-row.is-selected { opacity: 0.5; cursor: default; background: var(--surface-alt); }

    .selected-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      background: var(--primary-light);
      border: 1px solid #BFDBFE;
      border-radius: 6px;
    }
    .selected-card .name { font-weight: 600; font-size: 14px; color: var(--primary-dark); }
    .selected-card .meta { font-size: 12.5px; color: var(--primary); margin-top: 2px; }

    /* CHIPS */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 4px 4px 10px;
      font-size: 12.5px; font-weight: 500;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 14px;
    }
    .chip a { cursor: pointer; }
    .chip a:hover { text-decoration: underline; }
    .chip button {
      background: var(--primary); color: #fff;
      width: 18px; height: 18px;
      border: none; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; line-height: 1;
      cursor: pointer;
    }
    .chip button:hover { background: var(--primary-dark); }

    /* FORM FOOTER */
    .form-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
    }
    .form-footer-left, .form-footer-right { display: flex; gap: 8px; }

    /* AVATAR */
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary-dark);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      flex-shrink: 0;
    }
    .avatar-lg { width: 56px; height: 56px; font-size: 20px; }
    .avatar-square {
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text-muted);
    }

    /* ENTITY HEADER */
    .entity-head {
      display: flex; align-items: center; gap: 16px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-xs);
    }
    .entity-head .info { flex: 1; min-width: 0; }
    .entity-head h1 {
      margin: 0 0 4px;
      font-size: 22px; font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .entity-head .deck {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .entity-head .deck strong { color: var(--text); font-weight: 500; }
    .entity-head .deck .dot { color: var(--text-faint); }
    .entity-head .actions { display: flex; gap: 8px; }

    /* STAT CARDS */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 720px) { .stat-grid { grid-template-columns: 1fr; } }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      box-shadow: var(--shadow-xs);
    }
    .stat-card .label {
      font-size: 12px; font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 28px; font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }
    .stat-card .meta {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* GRID for forfattere/kunder index */
    .entity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .entity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .entity-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .entity-card .info { flex: 1; min-width: 0; }
    .entity-card .name {
      font-size: 14px; font-weight: 600;
      color: var(--text);
      margin: 0 0 2px;
      line-height: 1.3;
    }
    .entity-card:hover .name { color: var(--primary); }
    .entity-card .sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .entity-card .stats {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .entity-card .stats .n {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
    }

    /* MEDIA TILES (på kunde-detalj) */
    .media-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .media-tile {
      padding: 10px 14px;
      background: var(--surface-alt);
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .media-tile .name { font-size: 13px; font-weight: 500; color: var(--text); }
    .media-tile .num { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* SECTION */
    .section { margin-bottom: 24px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 12px;
      margin-bottom: 12px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 15px; font-weight: 600;
      color: var(--text);
    }
    .section-head .count { font-size: 12.5px; color: var(--text-muted); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 100;
      display: flex; align-items: center; gap: 10px;
      animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast.is-success { background: var(--success); }
    .toast.is-error { background: var(--danger); }
    .toast::before { content: '✓'; font-weight: 700; font-size: 15px; }
    .toast.is-error::before { content: '!'; }

    [v-cloak] { display: none; }
  </style>
</head>

<script type="module">
import { createApp, reactive, ref, computed, watch } from 'vue';

const BACKEND = {
  baseUrl:       '',
  apiKey:        '',
  saveIncludeId: 'visit-oslo-save-mention',
  getIncludeId:  'visit-oslo-get-mention',
  listIncludeId: 'visit-oslo-list-mentions',
};

const CATEGORIES = [
  'Reisereportasje', 'Anmeldelse', 'Nyhetsartikkel', 'Intervju',
  'Blogg / Influenser', 'TV / Radio', 'Podkast', 'Sosiale medier',
  'Bransje / Fagpresse', 'Pressemelding-dekning'
];

const CATEGORY_COLORS = {
  'Reisereportasje':       'badge-orange',
  'Anmeldelse':            'badge-pink',
  'Nyhetsartikkel':        'badge-cyan',
  'Intervju':              'badge-violet',
  'Blogg / Influenser':    'badge-rose',
  'TV / Radio':            'badge-blue',
  'Podkast':               'badge-teal',
  'Sosiale medier':        'badge-amber',
  'Bransje / Fagpresse':   'badge-slate',
  'Pressemelding-dekning': 'badge-green',
};

const STORAGE_KEY = 'visit-oslo-media-business-v1';
const state = reactive({ testMode: true, authors: [], customers: [], mentions: [] });

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    Object.assign(state, parsed);
    return true;
  } catch { return false; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    testMode: state.testMode, authors: state.authors,
    customers: state.customers, mentions: state.mentions,
  }));
}
watch(() => state, saveState, { deep: true });

function seedAuthors() {
  return [
    { id: 1,  firstname: 'Maja',    lastname: 'Solli',      email: 'maja.solli@aftenposten.no' },
    { id: 2,  firstname: 'Sofia',   lastname: 'Bergström',  email: 'sofia.b@svd.se' },
    { id: 3,  firstname: 'Anna',    lastname: 'Kowalski',   email: 'anna@condenast.com' },
    { id: 4,  firstname: 'James',   lastname: 'Whitfield',  email: 'jw@theguardian.com' },

function applySeed() {
  state.authors = seedAuthors();
  state.customers = seedCustomers();
  state.mentions = seedMentions();
  saveState();
}

function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function relativeDate(iso) {
  if (!iso) return '';
  const then = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - then) / (1000*60*60*24));
  if (diff < 1)   return 'i dag';
  if (diff < 2)   return 'i går';
  if (diff < 14)  return `${diff} dager siden`;
  if (diff < 60)  return `${Math.floor(diff/7)} uker siden`;
  if (diff < 365) return `${Math.floor(diff/30)} måneder siden`;
  return `${Math.floor(diff/365)} år siden`;
}
function initials(a, b) {
  if (!a) return '?';
  if (b) return (a[0] + b[0]).toUpperCase();
  const parts = a.split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return a.slice(0, 2).toUpperCase();
}
function categoryClass(cat) {
  return CATEGORY_COLORS[cat] || 'badge-slate';
}

const route = reactive({ path: window.location.pathname || '/', query: parseQuery() });
function parseQuery() {
  const q = {}; const s = window.location.search.slice(1);
  if (!s) return q;
  s.split('&').forEach(p => { const [k, v] = p.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return q;
}
function go(path) {
  if (path === window.location.pathname + window.location.search) return;
  window.history.pushState({}, '', path);
  route.path = window.location.pathname;
  route.query = parseQuery();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { route.path = window.location.pathname; route.query = parseQuery(); });
function isActive(p) { return route.path === p; }

const app = createApp({
  setup() {
    if (!loadState()) applySeed();

    const view = computed(() => {
      const p = route.path;
      if (p === '/' || p === '') return 'list';
      if (p === '/ny') return 'form';
      if (p.startsWith('/rediger/')) return 'form';
      if (p === '/forfatter') return 'authorIndex';
      if (p.startsWith('/forfatter/')) return 'authorDetail';
      if (p === '/kunde') return 'customerIndex';
      if (p.startsWith('/kunde/')) return 'customerDetail';
      return 'list';
    });

    const filter = reactive({ search: '', category: '', fromDate: '', toDate: '' });
    const filteredMentions = computed(() => {
      const list = [...state.mentions].sort((a, b) => (b.publicationDate || '').localeCompare(a.publicationDate || ''));
      return list.filter(m => {
        if (filter.search) {
          const q = filter.search.toLowerCase();
          const a = state.authors.find(x => x.id === m.authorPersonId);
          const aName = a ? `${a.firstname} ${a.lastname}` : '';
          if (!`${m.title} ${m.source} ${aName}`.toLowerCase().includes(q)) return false;
        }
        if (filter.category && m.category !== filter.category) return false;
        if (filter.fromDate && (m.publicationDate || '') < filter.fromDate) return false;
        if (filter.toDate && (m.publicationDate || '') > filter.toDate) return false;
        return true;
      });
    });

    function blankForm() {
      return { id: null, authorPersonId: null, title: '', publicationDate: new Date().toISOString().slice(0, 10), category: '', source: '', url: '', content: '', comment: '', memberIds: [] };
    }
    const form = reactive(blankForm());
    const authorPickerQuery = ref('');
    const authorPickerOpen = ref(false);
    const memberPickerQuery = ref('');
    const memberPickerOpen = ref(false);
    function closePickerSoon(which) {
      setTimeout(() => {
        if (which === 'author') authorPickerOpen.value = false;
        else memberPickerOpen.value = false;
      }, 150);
    }

    watch(view, (v) => {
      if (v === 'form') {
        const editId = route.path.startsWith('/rediger/') ? Number(route.path.split('/').pop()) : null;
        if (editId) {
          const m = state.mentions.find(x => x.id === editId);
          if (m) Object.assign(form, JSON.parse(JSON.stringify(m)));
          else Object.assign(form, blankForm());
        } else {
          Object.assign(form, blankForm());
          if (route.query.forfatter) form.authorPersonId = Number(route.query.forfatter);
        }
        authorPickerQuery.value = ''; memberPickerQuery.value = '';
      }
    }, { immediate: true });

    const authorMatches = computed(() => {
      if (!authorPickerQuery.value) return state.authors.slice(0, 6);
      const q = authorPickerQuery.value.toLowerCase();
      return state.authors.filter(p => `${p.firstname} ${p.lastname} ${p.email}`.toLowerCase().includes(q)).slice(0, 8);
    });
    const memberMatches = computed(() => {
      if (!memberPickerQuery.value) return state.customers.filter(c => !form.memberIds.includes(c.id)).slice(0, 6);
      const q = memberPickerQuery.value.toLowerCase();
      return state.customers.filter(c => `${c.name} ${c.city}`.toLowerCase().includes(q)).slice(0, 10);
    });

    function selectAuthor(p) { form.authorPersonId = p.id; authorPickerQuery.value = ''; authorPickerOpen.value = false; }
    function addMember(c)    { if (!form.memberIds.includes(c.id)) form.memberIds.push(c.id); memberPickerQuery.value = ''; memberPickerOpen.value = false; }
    function removeMember(id) { form.memberIds = form.memberIds.filter(x => x !== id); }

    const canSave = computed(() => form.authorPersonId && form.title.trim() && form.publicationDate && form.category);

    function authorName(id)  { const a = state.authors.find(x => x.id === id); return a ? `${a.firstname} ${a.lastname}` : ''; }
    function authorEmail(id) { const a = state.authors.find(x => x.id === id); return a ? a.email : ''; }
    function memberName(id)  { const c = state.customers.find(x => x.id === id); return c ? c.name : ''; }

    const currentAuthor = computed(() => {
      if (view.value !== 'authorDetail') return null;
      const id = Number(route.path.split('/').pop());
      return state.authors.find(p => p.id === id);
    });
    const authorMentions = computed(() => {
      if (!currentAuthor.value) return [];
      return [...state.mentions].filter(m => m.authorPersonId === currentAuthor.value.id)
        .sort((a, b) => (b.publicationDate || '').localeCompare(a.publicationDate || ''));
    });
    const authorCategoryCount = computed(() => {
      const set = new Set(authorMentions.value.map(m => m.category).filter(Boolean));
      return set.size;
    });
    const authorsWithCounts = computed(() =>
      [...state.authors].map(p => ({ ...p, mentionCount: state.mentions.filter(m => m.authorPersonId === p.id).length }))
        .sort((a, b) => b.mentionCount - a.mentionCount)
    );

    const currentCustomer = computed(() => {
      if (view.value !== 'customerDetail') return null;
      const id = Number(route.path.split('/').pop());
      return state.customers.find(c => c.id === id);
    });
    const customerMentions = computed(() => {
      if (!currentCustomer.value) return [];
      return [...state.mentions].filter(m => (m.memberIds || []).includes(currentCustomer.value.id))
        .sort((a, b) => (b.publicationDate || '').localeCompare(a.publicationDate || ''));
    });
    const customerMediaList = computed(() => {
      const map = {};
      customerMentions.value.forEach(m => { if (m.source) map[m.source] = (map[m.source] || 0) + 1; });
      return Object.entries(map).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
    });
    const customersWithCounts = computed(() =>
      [...state.customers].map(c => ({ ...c, mentionCount: state.mentions.filter(m => (m.memberIds || []).includes(c.id)).length }))
        .sort((a, b) => b.mentionCount - a.mentionCount)
    );

    const toast = ref(null);
    function showToast(msg, type = 'success') {
      toast.value = { msg, type };
      setTimeout(() => { toast.value = null; }, 2400);
    }

    async function saveForm() {
      if (!canSave.value) return;
      if (state.testMode) {
        if (form.id) {
          const idx = state.mentions.findIndex(m => m.id === form.id);
          if (idx !== -1) state.mentions[idx] = JSON.parse(JSON.stringify(form));
        } else {
          const newId = (Math.max(0, ...state.mentions.map(m => m.id)) + 1) || 1;
          state.mentions.push({ ...JSON.parse(JSON.stringify(form)), id: newId });
        }
        showToast(form.id ? 'Omtale oppdatert' : 'Omtale registrert');
        go('/');
        return;
      }
      try {
        const res = await fetch(`${BACKEND.baseUrl}?action=runIncluded&includeId=${BACKEND.saveIncludeId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CRMSCRIPT-KEY': BACKEND.apiKey },
          body: JSON.stringify(form),
        });
        if (!res.ok) throw new Error(res.statusText);
        showToast('Lagret til SuperOffice');
        go('/');
      } catch (e) {
        showToast('Feil: ' + e.message, 'error');
      }
    }

    function deleteCurrent() {
      if (!form.id) return;
      if (!confirm('Slett denne omtalen? Handlingen kan ikke angres.')) return;
      state.mentions = state.mentions.filter(m => m.id !== form.id);
      showToast('Omtale slettet');
      go('/');
    }

    function toggleTest() { state.testMode = !state.testMode; }
    function resetSeed() { if (confirm('Tilbakestill alle dummy-data?')) applySeed(); }
    function goNewWithAuthor(id) { go('/ny?forfatter=' + id); }

    return {
      route, view, isActive, go,
      state, CATEGORIES, filter, filteredMentions,
      form, authorPickerQuery, authorPickerOpen, memberPickerQuery, memberPickerOpen,
      authorMatches, memberMatches, selectAuthor, addMember, removeMember, closePickerSoon,
      canSave, authorName, authorEmail, memberName,
      currentAuthor, authorMentions, authorCategoryCount, authorsWithCounts,
      currentCustomer, customerMentions, customerMediaList, customersWithCounts,
      saveForm, deleteCurrent, toggleTest, resetSeed, goNewWithAuthor,
      formatDate, relativeDate, initials, categoryClass,
      toast,
    };
  }
});
app.mount('#app');
</script>
